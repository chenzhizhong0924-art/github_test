<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>我是AI智能客服</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>
<body>
    <div class="header">我是AI智能客服</div>
    <div class="content">
        <h2>聊天紀錄</h2>
        <div class="chat-box" id="chatBox">
            {% for msg in chat_history %}
            <div class="chat-message">
                {% if msg.role == "user" %}
                <p><strong>使用者：</strong>{{ msg.text }}</p>
                {% elif msg.role == "gpt_text" %}
                <p><strong>智能客服回應：</strong>{{ msg.text }}</p>
                {% endif %}
            </div>
            {% endfor %}
        </div>

        <form id="chatForm" class="chat-input">
            <textarea id="messageInput" name="message" placeholder="輸入訊息..." required rows="5"></textarea>
            <button type="submit">送出</button>
        </form>
    </div>

    <script src="{{ url_for('static', filename='js/index.js') }}"></script>
</body>
</html>
